<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peça não encontrada — Leonardo Lamin</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#03040A">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2303040A'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23FFB45E' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23000'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Manrope:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Buraco negro pequeno só com CSS: sombra preta, anel de fótons e disco girando. */
  :root{--void:#03040A;--ink:#ECEEF6;--muted:#A3A9C2;--hot:#FFB45E;--ember:#FF6B3D;color-scheme:dark}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%}
  body{
    background:radial-gradient(circle at 50% 30%,rgba(255,120,50,.10),transparent 45%),var(--void);
    color:var(--ink);font:400 16px/1.6 'Manrope',system-ui,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px 16px;
  }
  .bh{position:relative;width:140px;height:140px;margin-bottom:36px}
  .disk{position:absolute;inset:-34px -70px;border-radius:50%;transform:rotateX(74deg);
    background:conic-gradient(from 0deg,rgba(255,180,94,.9),rgba(255,107,61,.15),rgba(255,180,94,.6),rgba(255,107,61,.1),rgba(255,180,94,.9));
    -webkit-mask:radial-gradient(closest-side,transparent 52%,#000 56%,#000 80%,transparent 100%);
            mask:radial-gradient(closest-side,transparent 52%,#000 56%,#000 80%,transparent 100%);
    filter:blur(1.5px);animation:spin 6s linear infinite}
  .shadow{position:absolute;inset:22px;border-radius:50%;background:#000;
    box-shadow:0 0 0 2px rgba(255,210,150,.7),0 0 30px 8px rgba(255,140,60,.35),0 0 90px 30px rgba(255,90,40,.12)}
  @keyframes spin{to{transform:rotateX(74deg) rotate(360deg)}}
  .code{font:500 12px 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--hot);margin-bottom:14px}
  h1{font:700 clamp(24px,5vw,38px)/1.15 'Unbounded',sans-serif;letter-spacing:-.02em;max-width:18ch;margin-bottom:14px}
  p{max-width:440px;color:var(--muted);margin-bottom:8px}
  p[lang="en"]{font-size:14px;margin-bottom:32px}
  a{display:inline-block;padding:13px 22px;border-radius:999px;font:600 15px 'Manrope',sans-serif;text-decoration:none;color:#1A0C02;background:linear-gradient(120deg,var(--hot),var(--ember))}
  a:focus-visible{outline:2px solid var(--hot);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){.disk{animation-duration:15s}}
</style>
</head>
<body>
  <div class="bh" aria-hidden="true"><div class="disk"></div><div class="shadow"></div></div>
  <div class="code">Erro 404</div>
  <h1>Esta peça não está em exibição</h1>
  <p>O link que você seguiu caiu no horizonte de eventos — pode ter sido movido ou nunca existiu.</p>
  <p lang="en">This piece is not on display. The link may have moved or never existed.</p>
  <a href="/">← Voltar ao início</a>
</body>
</html>
